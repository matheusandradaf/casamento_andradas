<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amandha & Matheus | Gallery</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Header Minimalista -->
    <header class="header">
      <div class="container nav-wrapper">
        <a href="index.html" class="logo">AMANDHA & MATHEUS</a>
        <nav>
          <ul class="nav-links text-sm-spaced">
            <li><a href="index.html#story">Our Story</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="index.html#video">Save the Date</a></li>
            <li><a href="index.html#registry">Gifts</a></li>
            <li><a href="index.html#rsvp">RSVP</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="section-spacing text-center" style="padding-bottom: 2rem; padding-top: 10rem;">
        <div class="container">
          <p class="text-sm-spaced reveal-text" style="margin-bottom: 1rem;">Pré-Wedding</p>
          <h1 class="story-title reveal-text">Gallery</h1>
          <p class="story-text reveal-text" style="max-width: 600px; margin: 0 auto;">
            Um vislumbre dos nossos momentos favoritos juntos.
          </p>
        </div>
      </section>

      <!-- Masonry Grid -->
      <section class="gallery-section">
        <div class="container">
          <div class="masonry-grid">
            <!-- As imagens (placeholders) têm tamanhos variados para criar o efeito masonry -->
            <div class="masonry-item reveal-text masonry-tall">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>
            
            <div class="masonry-item reveal-text masonry-wide">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>

            <div class="masonry-item reveal-text masonry-square">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>

            <div class="masonry-item reveal-text masonry-tall">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>

            <div class="masonry-item reveal-text masonry-square">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>

            <div class="masonry-item reveal-text masonry-wide">
              <div class="parallax-container" style="height: 100%;">
                <div class="parallax-img placeholder-inner"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer text-center" style="margin-top: 6rem;">
      <div class="container">
        <h3 class="logo" style="font-size: 1.2rem; margin-bottom: 1rem;">A & M</h3>
        <p class="text-sm-spaced" style="font-size: 0.6rem; color: var(--color-text-light);">Desenvolvido com amor.</p>
      </div>
    </footer>

    <script type="module" src="/main.js"></script>
  </body>
</html>
